<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Timeseek Export - {{ entry.timestamp | timestamp_to_human_readable }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/inter.css') }}">
    <style>
        body { font-family: 'Inter', sans-serif; padding: 40px; color: #1c1b1f; background: #fffbff; }
        .header { border-bottom: 2px solid #6750a4; padding-bottom: 12px; margin-bottom: 24px; }
        .meta { font-size: 14px; color: #49454f; margin-bottom: 20px; line-height: 1.6; }
        img { max-width: 100%; border: 1px solid #c4c7c5; border-radius: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        .section { margin-top: 32px; }
        .section-title { font-weight: 600; font-size: 18px; margin-bottom: 12px; color: #6750a4; }
        .content { background: #f3edf7; padding: 16px; border-radius: 12px; white-space: pre-wrap; font-size: 14px; color: #1d192b; }
        button { font-family: 'Inter', sans-serif; }
        @media print {
            .no-print { display: none; }
        }
    </style>
</head>
<body>
    <div class="no-print" style="margin-bottom: 24px; display: flex; gap: 12px;">
        <button onclick="window.print()" style="padding: 10px 24px; cursor: pointer; background: #6750a4; color: #ffffff; border: none; border-radius: 9999px; font-weight: 500; font-size: 14px;">Print / Save as PDF</button>
        <button onclick="window.history.back()" style="padding: 10px 24px; cursor: pointer; background: #e8def8; color: #1d192b; border: none; border-radius: 9999px; font-weight: 500; font-size: 14px;">Back</button>
    </div>

    <div class="header">
        <h1>{{ entry.app }}</h1>
        <div class="meta">
            <strong>Title:</strong> {{ entry.title }}<br>
            <strong>Captured:</strong> {{ entry.timestamp | timestamp_to_human_readable }}
        </div>
    </div>

    <img src="/static/{{ entry.filename }}" alt="Snapshot">

    {% if entry.notes %}
    <div class="section">
        <div class="section-title">Notes</div>
        <div class="content">{{ entry.notes }}</div>
    </div>
    {% endif %}

    {% if entry.text %}
    <div class="section">
        <div class="section-title">OCR Text</div>
        <div class="content">{{ entry.text }}</div>
    </div>
    {% endif %}

    <div style="margin-top: 50px; font-size: 10px; color: #999; text-align: center;">
        Generated by Timeseek - Your Personal Digital Memory
    </div>
</body>
</html>
