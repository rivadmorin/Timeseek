{% extends "layout.html" %}
{% block content %}
<style>
    .snapshot-detail-container {
        max-width: 1000px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        gap: 24px;
    }

    .detail-card {
        background-color: var(--md-sys-color-surface-container-low);
        border-radius: var(--md-sys-shape-corner-extra-large);
        border: 1px solid var(--md-sys-color-outline-variant);
        overflow: hidden;
        display: flex;
        flex-direction: column;
    }

    .detail-header {
        padding: 20px 24px;
        background-color: var(--md-sys-color-surface-container);
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid var(--md-sys-color-outline-variant);
    }

    .app-meta {
        display: flex;
        align-items: center;
        gap: 12px;
    }

    .app-title {
        font-size: 18px;
        font-weight: 600;
        color: var(--md-sys-color-on-surface);
    }

    .window-title {
        font-size: 14px;
        color: var(--md-sys-color-on-surface-variant);
    }

    .header-actions {
        display: flex;
        gap: 12px;
        align-items: center;
    }

    .action-btn {
        background-color: var(--md-sys-color-surface-container-high);
        color: var(--md-sys-color-on-surface);
        width: 40px;
        height: 40px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: all 0.2s;
        text-decoration: none;
    }

    .action-btn:hover {
        background-color: var(--md-sys-color-primary);
        color: var(--md-sys-color-on-primary);
    }

    .action-btn.favorite-btn.active {
        color: #f59e0b;
    }

    .action-btn.delete-btn:hover {
        background-color: var(--md-sys-color-error);
        color: var(--md-sys-color-on-error);
    }

    .image-preview-wrapper {
        padding: 24px;
        background-color: var(--md-sys-color-surface-container-lowest);
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .preview-img {
        max-width: 100%;
        max-height: 70vh;
        border-radius: var(--md-sys-shape-corner-large);
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
        object-fit: contain;
    }

    .detail-body {
        padding: 24px;
        display: flex;
        flex-direction: column;
        gap: 20px;
    }

    .section-label {
        font-size: 13px;
        font-weight: 600;
        color: var(--md-sys-color-primary);
        text-transform: uppercase;
        letter-spacing: 0.5px;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .notes-box {
        width: 100%;
        background-color: var(--md-sys-color-surface-container-highest);
        border: 1px solid var(--md-sys-color-outline-variant);
        border-radius: var(--md-sys-shape-corner-medium);
        padding: 12px 16px;
        color: var(--md-sys-color-on-surface);
        font-family: inherit;
        font-size: 14px;
        resize: vertical;
        min-height: 60px;
        outline: none;
    }

    .notes-box:focus {
        border-color: var(--md-sys-color-primary);
    }

    .ocr-text-box {
        background-color: var(--md-sys-color-surface-container);
        border-radius: var(--md-sys-shape-corner-medium);
        padding: 16px;
        font-size: 14px;
        white-space: pre-wrap;
        color: var(--md-sys-color-on-surface);
        border: 1px solid var(--md-sys-color-outline-variant);
        max-height: 300px;
        overflow-y: auto;
    }

    .chip-btn {
        background-color: var(--md-sys-color-primary-container);
        color: var(--md-sys-color-on-primary-container);
        padding: 4px 12px;
        border-radius: var(--md-sys-shape-corner-full);
        font-size: 12px;
        font-weight: 500;
        cursor: pointer;
        border: none;
    }
</style>

<div class="snapshot-detail-container">
    <div class="detail-card">
        <div class="detail-header">
            <div class="app-meta">
                <span class="material-symbols-rounded" style="font-size: 28px; color: var(--md-sys-color-primary);">camera</span>
                <div>
                    <div class="app-title">{{ entry.app or 'Unknown App' }}</div>
                    <div class="window-title">{{ entry.title or 'Untitled Window' }} &bull; {{ entry.timestamp | timestamp_to_human_readable }}</div>
                </div>
            </div>

            <div class="header-actions">
                <button id="favBtn" class="action-btn favorite-btn {% if entry.is_favorite %}active{% endif %}" onclick="toggleFavorite()" title="Toggle Favorite">
                    <span class="material-symbols-rounded">{% if entry.is_favorite %}star{% else %}star_outline{% endif %}</span>
                </button>
                <a href="/export/pdf/{{ entry.id }}" target="_blank" class="action-btn" title="Export PDF">
                    <span class="material-symbols-rounded">picture_as_pdf</span>
                </a>
                <button class="action-btn delete-btn" onclick="deleteSnapshot()" title="Delete Snapshot">
                    <span class="material-symbols-rounded">delete</span>
                </button>
            </div>
        </div>

        <div class="image-preview-wrapper">
            <img src="/static/{{ entry.filename }}" alt="Snapshot Preview" class="preview-img">
        </div>

        <div class="detail-body">
            <div>
                <div class="section-label" style="margin-bottom: 8px;">
                    Personal Notes
                </div>
                <textarea id="notesInput" class="notes-box" placeholder="Add personal context or notes to this snapshot...">{{ entry.notes }}</textarea>
            </div>

            {% if entry.text %}
            <div>
                <div class="section-label" style="margin-bottom: 8px;">
                    OCR Extracted Text
                    <button class="chip-btn" onclick="copyOcrText()">Copy Text</button>
                </div>
                <div id="ocrContent" class="ocr-text-box">{{ entry.text }}</div>
            </div>
            {% endif %}
        </div>
    </div>
</div>

<script>
    let isFavorite = {{ 'true' if entry.is_favorite else 'false' }};

    async function toggleFavorite() {
        const btn = document.getElementById('favBtn');
        const icon = btn.querySelector('.material-symbols-rounded');
        isFavorite = !isFavorite;

        try {
            const res = await fetch(`/api/entries/{{ entry.id }}/favorite`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ is_favorite: isFavorite })
            });
            if (res.ok) {
                btn.classList.toggle('active', isFavorite);
                icon.textContent = isFavorite ? 'star' : 'star_outline';
            }
        } catch (err) {
            console.error('Error toggling favorite:', err);
        }
    }

    const notesInput = document.getElementById('notesInput');
    notesInput.addEventListener('blur', async () => {
        try {
            await fetch(`/update_note/{{ entry.id }}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ notes: notesInput.value })
            });
        } catch (err) {
            console.error('Error updating note:', err);
        }
    });

    function copyOcrText() {
        const ocr = document.getElementById('ocrContent').innerText;
        navigator.clipboard.writeText(ocr).then(() => {
            alert('OCR text copied to clipboard!');
        });
    }

    async function deleteSnapshot() {
        if (!confirm('Are you sure you want to delete this snapshot?')) return;
        try {
            const res = await fetch(`/delete/{{ entry.id }}`, { method: 'POST' });
            if (res.ok) {
                window.location.href = '/timeline';
            }
        } catch (err) {
            console.error('Error deleting snapshot:', err);
        }
    }
</script>
{% endblock %}
