[package]
name = "timeseek"
version = "0.2.0"
edition = "2021"
authors = ["Timeseek Contributors"]
description = "Privacy-first offline digital memory & screen recording system written in Rust"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
axum = { version = "0.7", features = ["macros", "multipart"] }
tower-http = { version = "0.5", features = ["fs", "cors", "trace"] }
minijinja = { version = "2.0", features = ["loader", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.31", features = ["bundled"] }
clap = { version = "4.5", features = ["derive"] }
image = "0.25"
imageproc = "0.25"
screenshots = { version = "0.8", default-features = false }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = "0.3"
walkdir = "2.5"
lazy_static = "1.4"
regex = "1.10"
dirs = "5.0"

[dev-dependencies]
reqwest = { version = "0.12", features = ["json"] }
tempfile = "3.10"

[[bin]]
name = "timeseek"
path = "src/main.rs"
